services:
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:latest
    container_name: redpanda
    user: root
    command: redpanda start
    ports:
      - "8092:8092"
      - "9092:9092"
      - "9093:9093"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster info -X user=admin -X pass=password -X sasl.mechanism=SCRAM-SHA-256"]
      start_period: 2s
      interval: 5s
      timeout: 10s
      retries: 5
    environment:
      TZ: Europe/Berlin
    volumes:
      - ./.volumes/redpanda/redpanda.yaml:/etc/redpanda/redpanda.yaml
      - ./.volumes/redpanda/data:/var/lib/redpanda/data

  # for adding cors to the pandaproxy
  nginx_pandaproxy:
    image: nginx:latest
    ports: 
      - 8091:8091
    volumes:
      - ./.nginx/nginx.pandaproxy.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      redpanda:
        condition: service_healthy

  console:
    image: docker.redpanda.com/redpandadata/console:latest
    container_name: redpanda-console
    healthcheck:
      test: wget --no-verbose --no-check-certificate --tries=1 --spider http://host.docker.internal:8090 || exit 1
      interval: 5s
      timeout: 10s
      retries: 5
    environment:
      CONFIG_FILEPATH: /etc/redpanda/redpanda-console-config.yaml
    ports:
      - "8090:8080"
    volumes:
      - ./.volumes/console/redpanda-console-config.yaml:/etc/redpanda/redpanda-console-config.yaml
    depends_on:
      redpanda:
        condition: service_healthy

  keycloak:
    image: keycloak/keycloak:26.5
    container_name: keycloak
    ports: 
      - "8070:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: password
    command: start-dev
    volumes:
      - ./.volumes/keycloak:/opt/keycloak/data/h2

  # for adding cors to the pandaproxy
  nginx_frontend:
    build:
      context: ./frontend
      args:
        APP_ENV: development
        NODE_VERSION: 24.14.0-alpine3.23
    ports: 
      - 3000:3000
    volumes:
      - ./.nginx/nginx.frontend.conf:/etc/nginx/conf.d/default.conf