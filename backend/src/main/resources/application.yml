server:
    port: ${PORT}
    servlet:
        session:
            timeout: 86400 # 1 day

spring:
    main:
        web-application-type: reactive
    ### App
    application:
        name: ${API_NAME}
    config:
        # include .env file
        import: optional:file:.env[.properties]
    output:
        # colored terminal
        ansi:
            enabled: ALWAYS

    ### Security
    autoconfigure:
        # disable auto generated password
        exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
    security:
        oauth2:
            client:
                # redirect-uri is the spring default: /login/oauth2/code/{clientRegistrationId}
                registration:
                    keycloak:
                        redirect-uri: ${BASE_URL}/login/oauth2/code/keycloak
                        client-id: ${OAUTH2_CLIENT_ID_KEYCLOAK}
                        client-secret: ${OAUTH2_CLIENT_SECRET_KEYCLOAK}
                        scope: 
                            - email
                            - openid
                provider:
                    keycloak:
                        issuer-uri: ${OAUTH2_ISSUER_URI_KEYCLOAK}
                        
    ### DB
    datasource:
        # url: jdbc:mariadb://${DB_HOST}:${DB_PORT}/${DB_NAME}
        # h2
        url: jdbc:h2:mem:db
        username: ${DB_USER}
        password: ${DB_PASSWORD}
    jpa:
        hibernate:
            ddl-auto: update
        defer-datasource-initialization: true
        open-in-view: false
        # don't validate during db actions
        properties:
            jakarta:
                persistence:
                    validation:
    h2:
        console:
            enabled: true

    ### Mail
    mail:
        host: ${MAIL_HOST}
        port: ${MAIL_PORT}
        username: ${MAIL_USER}
        password: ${MAIL_PASSWORD}
        properties:
            mail:
                smtp:
                    auth: ${SMTP_AUTH_ENABLE}
                    starttls:
                        enable: ${MAIL_STARTTLS_ENABLE}
    # cloud:
    #     gateway:
    #         httpclient:
    #                 ssl:
    #                     # useInsecureTrustManager: true
    #                     trustedX509Certificates:
    #                         - classpath:ssl/localhost.crt

springdoc:
    api-docs:
        enabled: ${SWAGGER_ENABLED}
        path: /${NON_FRONTEND_MAPPING}/v3/api-docs
    swagger-ui:
        enabled: ${SWAGGER_ENABLED}
        path: /${NON_FRONTEND_MAPPING}/swagger-ui/index.html
logging:
    level:
        com:
            example: ${LOG_LEVEL}
